name: Build Windows ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Get Files
        uses: actions/checkout@v4

      - name: Configure Auto-Exit
        run: (Get-Content ConvertConfig.ini) -replace 'AutoExit\s*=\s*0', 'AutoExit=1' | Set-Content ConvertConfig.ini

      - name: Run Windows Script (Bypass UAC)
        shell: cmd
        run: cmd.exe /c uup_download_windows.cmd 49127c4b-02dc-482e-ac4f-ec4d659b7547
        
      - name: Find the generated ISO
        id: find_iso
        run: |
          $isoFile = Get-ChildItem -Filter *.iso | Select-Object -First 1
          echo "iso_name=$($isoFile.Name)" >> $env:GITHUB_ENV

      - name: Upload ISO for you to download
        uses: actions/upload-artifact@v4
        with:
          name: windows-iso
          path: ./${{ env.iso_name }}
          retention-days: 3
